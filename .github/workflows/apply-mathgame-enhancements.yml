name: Apply Mathgame enhancements

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/apply-mathgame-enhancements.yml

permissions:
  contents: write

jobs:
  patch-game:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply requested game enhancements
        run: python .github/apply_mathgame_enhancements.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index changes"
            exit 0
          fi
          git commit -m "Enhance Mathgame without changing existing game flow"
          git push origin main
