name: Optimize mobile performance

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/optimize-mobile-performance.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/optimize_mobile.py

      - name: Check JavaScript
        run: |
          python - <<'PY'
          import re
          s=open('index.html').read()
          open('/tmp/mathgame.js','w').write('\n'.join(re.findall(r'<script>(.*?)</script>',s,re.S)))
          PY
          node --check /tmp/mathgame.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix mobile scrolling, loading and game performance"
          git push
