<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>Math Defenders: Zombie Invasion</title>

<style>

/* =========================================================
   01 — GLOBAL
========================================================= */

:root{
    --bg:#06121f;
    --panel:#10283c;
    --panel2:#16364d;
    --line:#315875;

    --text:#f6fbff;
    --muted:#a9c2d5;

    --cyan:#66e8ff;
    --yellow:#ffd965;
    --green:#68f5a0;
    --red:#ff6978;
    --purple:#c48aff;

    --safe-bottom:env(safe-area-inset-bottom,0px);
}

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    overflow:hidden;
    background:var(--bg);
}

body{
    color:var(--text);
    font-family:
        "Trebuchet MS",
        "Segoe UI",
        Arial,
        sans-serif;
}

button,
input,
select{
    font:inherit;
}

button{
    cursor:pointer;
}

button:disabled{
    cursor:not-allowed;
    opacity:.45;
}

.screen{
    position:fixed;
    inset:0;
    display:none;
}

.screen.active{
    display:flex;
}

/* =========================================================
   02 — MENU
========================================================= */

#menuScreen{
    overflow:auto;
    background:
        linear-gradient(90deg,#06121ff2,#06121f88),
        url("./background_stage_01.png")
        center/cover no-repeat;
}

.menu-inner{
    width:min(1100px,100%);
    min-height:100%;
    margin:auto;
    padding:
        max(24px,env(safe-area-inset-top))
        22px
        max(30px,var(--safe-bottom));

    display:flex;
    flex-direction:column;
    justify-content:center;
}

.logo-small{
    font-size:14px;
    font-weight:900;
    letter-spacing:3px;
    color:var(--cyan);
}

.title{
    margin:10px 0;
    font-size:clamp(44px,9vw,92px);
    line-height:.88;
    letter-spacing:-4px;
    text-transform:uppercase;
}

.title span{
    color:var(--yellow);
}

.subtitle{
    max-width:580px;
    color:#c9dce9;
    font-size:clamp(16px,2vw,21px);
}

.menu-card{
    margin-top:24px;

    width:min(540px,100%);
    padding:22px;

    background:#081c2edc;
    border:1px solid #3b627d;
    border-radius:22px;

    backdrop-filter:blur(9px);
}

.setting{
    margin-bottom:16px;
}

.setting label{
    display:block;
    color:var(--muted);
    font-size:13px;
    font-weight:900;
    margin-bottom:6px;
}

.setting select,
.setting input{
    width:100%;
    padding:13px 14px;

    background:#061725;
    color:white;

    border:1px solid #41647c;
    border-radius:12px;
}

.primary{
    width:100%;

    border:0;
    border-radius:14px;

    padding:15px;

    font-size:18px;
    font-weight:900;

    color:#182332;
    background:var(--yellow);

    box-shadow:0 5px 0 #9a7525;
}

.primary:active{
    transform:translateY(3px);
    box-shadow:0 2px 0 #9a7525;
}

.hero-menu{
    position:absolute;
    right:2vw;
    bottom:0;

    height:min(78vh,780px);

    filter:
        drop-shadow(0 20px 20px #0008);
}

@media(max-width:800px){

    .hero-menu{
        opacity:.35;
        right:-15vw;
        height:58vh;
    }

    .title{
        letter-spacing:-2px;
    }
}

/* =========================================================
   03 — GAME FULLSCREEN
========================================================= */

#gameScreen{
    flex-direction:column;

    width:100vw;
    height:100dvh;

    overflow:hidden;
    background:#05101b;
}

/* =========================================================
   04 — HUD
========================================================= */

.hud{
    flex:0 0 auto;

    display:grid;
    grid-template-columns:
        minmax(100px,1fr)
        minmax(200px,2fr)
        auto;

    align-items:center;
    gap:12px;

    padding:
        max(8px,env(safe-area-inset-top))
        12px
        8px;

    background:#071726eb;
    border-bottom:1px solid #29465d;
}

.hud-left{
    display:flex;
    gap:14px;
    align-items:center;

    font-weight:900;
}

.hp{
    color:#ff8b95;
}

.wave{
    color:var(--yellow);
}

.power-box{
    min-width:0;
}

.power-title{
    display:flex;
    justify-content:space-between;

    font-size:12px;
    font-weight:900;
    color:#d5e8f4;

    margin-bottom:4px;
}

.power-bar{
    height:14px;

    border:1px solid #3d6884;
    border-radius:999px;

    overflow:hidden;

    background:#05131e;
}

.power-fill{
    height:100%;
    width:0%;

    background:
        linear-gradient(
            90deg,
            #42d8ff,
            #7fffb4,
            #ffe276
        );

    transition:width .25s;
}

.hud-buttons{
    display:flex;
    gap:7px;
}

.icon-btn{
    min-width:46px;
    height:42px;

    border:1px solid #3a6079;
    border-radius:11px;

    color:white;
    background:#123249;

    font-weight:900;
}

/* =========================================================
   05 — ARENA
========================================================= */

.arena{
    position:relative;
    flex:1 1 auto;

    overflow:hidden;

    background:
        linear-gradient(#06142222,#06142233),
        url("./background_stage_01.png")
        center/cover no-repeat;
}

.arena::after{
    content:"";
    position:absolute;
    left:0;
    right:0;
    bottom:0;

    height:35%;

    pointer-events:none;

    background:
        linear-gradient(
            transparent,
            rgba(2,11,18,.35)
        );
}

.base-line{
    position:absolute;

    left:13%;
    top:0;
    bottom:0;

    width:3px;

    background:#64e9ff55;

    z-index:3;
}

.hero{
    position:absolute;

    left:2.3%;
    bottom:5%;

    width:clamp(90px,13vw,180px);
    height:48%;

    z-index:5;

    display:flex;
    align-items:end;
    justify-content:center;

    transform-origin:center bottom;
}

.hero img{
    width:100%;
    height:100%;
    object-fit:contain;

    filter:
        drop-shadow(0 12px 12px #0009);

    animation:heroIdle 2.4s ease-in-out infinite;
}

@keyframes heroIdle{

    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-5px) scale(1.012);
    }
}

.hero.shoot img{
    animation:heroShoot .22s ease;
}

@keyframes heroShoot{

    50%{
        transform:
            translateX(-10px)
            rotate(-3deg)
            scale(1.05);
    }
}

.hero.hit img{
    animation:heroHit .35s ease;
}

@keyframes heroHit{

    25%{
        transform:translateX(-14px);
        filter:
            brightness(2)
            drop-shadow(0 0 15px red);
    }

    50%{
        transform:translateX(7px);
    }
}

.zombie{
    position:absolute;

    z-index:4;

    width:clamp(82px,11vw,155px);
    height:45%;

    display:flex;
    flex-direction:column;

    align-items:center;
    justify-content:end;

    pointer-events:none;
}

.zombie img{
    max-width:100%;
    max-height:88%;

    object-fit:contain;

    filter:
        drop-shadow(0 10px 10px #000a);

    animation:
        zombieWalk .6s ease-in-out infinite alternate;
}

@keyframes zombieWalk{

    from{
        transform:
            translateY(0)
            rotate(-1.5deg);
    }

    to{
        transform:
            translateY(-5px)
            rotate(2deg);
    }
}

.zombie.hit img{
    animation:zombieHit .19s;
}

@keyframes zombieHit{

    50%{
        transform:
            translateX(10px)
            scale(1.06);

        filter:
            brightness(2)
            drop-shadow(0 0 15px white);
    }
}

.zombie.dead{
    transition:
        opacity .5s,
        transform .5s;

    opacity:0;

    transform:
        rotate(15deg)
        translateY(40px);
}

.zombie-hp{
    width:78%;
    height:8px;

    margin-bottom:4px;

    border-radius:99px;
    overflow:hidden;

    background:#301b22;

    border:1px solid #70414c;
}

.zombie-hp span{
    display:block;

    width:100%;
    height:100%;

    background:#74f59c;

    transition:width .2s;
}

/* =========================================================
   06 — PROJECTILE
========================================================= */

.projectile{
    position:absolute;

    z-index:8;

    width:26px;
    height:12px;

    border-radius:999px;

    background:
        linear-gradient(
            90deg,
            white,
            #71f2ff,
            #379cff
        );

    box-shadow:
        0 0 10px #69eeff,
        0 0 26px #3badff;

    pointer-events:none;
}

.projectile.power{
    width:44px;
    height:24px;

    background:
        radial-gradient(
            circle,
            white,
            #ffe36e 38%,
            #7bf4ff 62%,
            #7859ff
        );

    box-shadow:
        0 0 18px white,
        0 0 35px #ffd85e,
        0 0 55px #58ddff;
}

.impact{
    position:absolute;

    z-index:10;

    width:60px;
    height:60px;

    border-radius:50%;

    pointer-events:none;

    background:
        radial-gradient(
            circle,
            white,
            #65efff 20%,
            #ffd763 42%,
            transparent 70%
        );

    animation:impact .35s forwards;
}

@keyframes impact{

    from{
        opacity:1;
        transform:scale(.3);
    }

    to{
        opacity:0;
        transform:scale(1.8);
    }
}

/* =========================================================
   07 — WRONG STEP EFFECT
========================================================= */

.wrong-flash{
    position:absolute;
    inset:0;

    z-index:30;

    pointer-events:none;

    background:#ff334422;

    animation:wrongFlash .3s;
}

@keyframes wrongFlash{

    from{
        opacity:1;
    }

    to{
        opacity:0;
    }
}

.step-alert{
    position:absolute;

    z-index:20;

    top:20%;
    left:50%;

    transform:translateX(-50%);

    padding:8px 14px;

    color:#fff;
    background:#a92c39e8;

    border:1px solid #ff8590;
    border-radius:10px;

    font-weight:900;

    pointer-events:none;

    animation:alertMove .7s forwards;
}

@keyframes alertMove{

    from{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1);
    }

    to{
        opacity:0;
        transform:
            translate(-50%,-35px)
            scale(1.15);
    }
}

/* =========================================================
   08 — QUICK BONUS
========================================================= */

.quick-bonus{
    position:absolute;

    z-index:25;

    top:18%;
    left:50%;

    transform:translateX(-50%);

    text-align:center;

    pointer-events:none;

    animation:bonusPop .85s forwards;
}

.quick-bonus strong{
    display:block;

    font-size:
        clamp(23px,5vw,44px);

    color:var(--yellow);

    text-shadow:
        0 0 15px #ffae00;
}

.quick-bonus span{
    font-weight:900;
    color:white;
}

@keyframes bonusPop{

    from{
        opacity:0;
        transform:
            translate(-50%,20px)
            scale(.8);
    }

    20%{
        opacity:1;
        transform:
            translate(-50%,0)
            scale(1.12);
    }

    to{
        opacity:0;
        transform:
            translate(-50%,-45px)
            scale(1);
    }
}

/* =========================================================
   09 — QUESTION PANEL
========================================================= */

.question-panel{
    flex:0 0 auto;

    padding:
        10px
        12px
        calc(10px + var(--safe-bottom));

    background:#071725;
    border-top:1px solid #31526a;
}

.question-inner{
    width:min(950px,100%);
    margin:auto;
}

.question-meta{
    display:flex;
    justify-content:space-between;
    gap:10px;

    margin-bottom:7px;

    font-size:12px;
    color:var(--muted);
}

.question{
    text-align:center;

    font-size:
        clamp(27px,5vw,48px);

    font-weight:900;

    line-height:1.05;

    margin-bottom:10px;
}

.answers{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
}

.answer{
    min-height:54px;

    border:1px solid #406781;
    border-radius:12px;

    color:white;
    background:#123149;

    font-size:
        clamp(18px,3vw,26px);

    font-weight:900;
}

.answer:hover{
    background:#1b4965;
}

.feedback{
    min-height:23px;

    text-align:center;

    margin-top:7px;

    color:var(--cyan);
    font-weight:900;
}

/* =========================================================
   10 — BOSS WARNING
========================================================= */

.boss-warning{
    position:absolute;
    inset:0;

    z-index:50;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#2d0710bd;

    text-align:center;

    animation:bossWarning .45s infinite alternate;
}

.boss-warning strong{
    display:block;

    color:#ffdc6c;

    font-size:
        clamp(44px,12vw,110px);

    line-height:.85;

    letter-spacing:-4px;
}

.boss-warning span{
    font-size:
        clamp(18px,4vw,36px);

    font-weight:900;
}

@keyframes bossWarning{

    to{
        background:#500815d4;
    }
}

/* =========================================================
   11 — RESULT
========================================================= */

#resultScreen{
    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        linear-gradient(#05101be8,#05101be8),
        url("./background_stage_01.png")
        center/cover;
}

.result-card{
    width:min(580px,100%);

    padding:28px;

    text-align:center;

    border:1px solid #446b83;
    border-radius:24px;

    background:#0a2133ea;
}

.result-card h1{
    margin:0 0 10px;

    font-size:
        clamp(40px,8vw,76px);

    color:var(--yellow);
}

.result-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;

    margin:20px 0;
}

.result-stat{
    padding:15px 5px;

    background:#061725;
    border-radius:13px;
}

.result-stat strong{
    display:block;

    font-size:25px;

    color:var(--cyan);
}

/* =========================================================
   12 — MOBILE
========================================================= */

@media(max-width:720px){

    .hud{
        grid-template-columns:1fr auto;
    }

    .power-box{
        grid-column:1/-1;
        grid-row:2;
    }

    .hud-left{
        font-size:13px;
    }

    .answers{
        grid-template-columns:1fr 1fr;
    }

    .question-panel{
        padding-top:7px;
    }

    .question{
        font-size:
            clamp(25px,8vw,38px);
    }

    .arena{
        min-height:0;
    }

    .hero{
        width:24vw;
        height:44%;
        left:-1%;
    }

    .zombie{
        width:23vw;
        height:43%;
    }

    .base-line{
        left:19%;
    }
}

@media(max-height:650px){

    .question{
        font-size:25px;
        margin-bottom:6px;
    }

    .answer{
        min-height:44px;
    }

    .question-panel{
        padding-top:6px;
    }

    .hero,
    .zombie{
        height:43%;
    }
}

</style>
</head>

<body>

<!-- =========================================================
     MENU
========================================================= -->

<section
    id="menuScreen"
    class="screen active"
>

    <div class="menu-inner">

                    </option>

                    <option value="4">

                    </option>

                    <option value="5">

                    </option>

<!-- =========================================================

<section

            </div>

                <div
                    id="powerFill"
                    class="power-fill"

        <div class="hud-buttons">

            <button
                id="soundBtn"

<!-- =========================================================
     RESULT
========================================================= -->

<section
    id="resultScreen"
    class="screen"
>

    <div class="result-card">

        <h1 id="resultTitle">
            MENANG!
        </h1>

        <p id="resultText">
            Bandar berjaya dipertahankan.
        </p>

        <div class="result-stats">

            <div class="result-stat">

                <strong id="correctStat">
                    0
                </strong>

                Betul

            </div>

            <div class="result-stat">

                <strong id="accuracyStat">
                    0%
                </strong>

                Ketepatan

            </div>

            <div class="result-stat">

                <strong id="comboStat">
                    0
                </strong>

                Combo

            </div>

        </div>

        <button
            id="playAgainBtn"
            class="primary"
        >
            MAIN SEMULA
        </button>

    </div>

/* =========================================================

const IMG = {

    basic:
        "./zombie_basic.png",

        "./boss_zombie_king.png",

        "./boss_mother_z.png"

};


/* =========================================================
   14 — SOUND DATABASE
========================================================= */

const SOUND_BASE =
    "./sound/";

const SOUND_FILES = {

    bgm:
        "bgm_math_defenders_main_theme.wav",

    correct:
        "sfx_answer_correct.wav",

    wrong:
        "sfx_answer_wrong.wav",

    blaster:
        "sfx_blaster_shot.wav",

    bossDefeat:
        "sfx_boss_defeat.wav",

    bossHit:
        "sfx_boss_hit.wav",

    bossIntro:
        "sfx_boss_intro.wav",

    bossWarning:
        "sfx_boss_warning.wav",

    coin:
        "sfx_coin_pickup.wav",

    comboBig:
        "sfx_combo_big.wav",

    comboUp:
        "sfx_combo_up.wav",

        "sfx_defeat.wav",

    heroHit:

    heroVictory:
        "sfx_hero_victory.wav",

    hint:

/* =========================================================
   15 — AUDIO ENGINE
========================================================= */

let soundEnabled = true;

const sounds = {};

let bgm = null;

let zombieWalkAudio = null;


/* preload SFX */

function initAudio(){

    Object.entries(
        SOUND_FILES
    ).forEach(([key,file])=>{

        if(
            key === "bgm" ||
            key === "zombieWalk"
        ){
            return;
        }

        const audio =
            new Audio(
                SOUND_BASE + file
            );

        audio.preload =
            "auto";

        sounds[key] =
            audio;

    });


    /* BGM */

    bgm =
        new Audio(
            SOUND_BASE +
            SOUND_FILES.bgm
        );

    bgm.loop =
        true;

    bgm.volume =
        .22;


    /* satu zombie walking ambient sahaja */

    zombieWalkAudio =
        new Audio(
            SOUND_BASE +
            SOUND_FILES.zombieWalk
        );

    zombieWalkAudio.loop =
        true;

    zombieWalkAudio.volume =
        .12;

}


/* play SFX */

function playSfx(
    name,
    volume = .65
){

    if(
        !soundEnabled ||
        !sounds[name]
    ){
        return;
    }

    const a =
        sounds[name].cloneNode();

    a.volume =
        Math.max(
            0,
            Math.min(
                1,
                volume
            )
        );

    a.play()
    .catch(()=>{});

}


/* start background audio */

function startAudio(){

    if(
        !soundEnabled
    ){
        return;
    }

    bgm?.play()
    .catch(()=>{});

    zombieWalkAudio?.play()
    .catch(()=>{});

}


/* stop */

function stopAudio(){

    bgm?.pause();

    zombieWalkAudio?.pause();

}

/* =========================================================
   18 — HELPERS
========================================================= */

function clamp(
    n,
    min,
    max
){

    return Math.max(
        min,
        Math.min(
            max,
            n
        )
    );

}


function random(
    min,
    max
){

    return Math.floor(
        Math.random() *
        (
            max -
            min +
            1
        )
    ) + min;

}


function choose(arr){

    return arr[
        random(
            0,
            arr.length - 1
        )
    ];

}


function showScreen(

){

/* =========================================================
   19 — QUESTION GENERATOR
========================================================= */

function makeQuestion(){

    const year =
        state.year;

    let a;
    let b;
    let answer;
    let text;


    /* Tahun 1 */

    if(
        year === 1
    ){

        a =
            random(
                1,
                10
            );

        b =
            random(
                1,
                10
            );

        answer =
            a + b;

        text =
            `${a} + ${b} = ?`;

    }


    /* Tahun 2 */

    else if(
        year === 2
    ){

        const plus =
            Math.random() < .55;

        if(
            plus
        ){

            a =
                random(
                    5,
                    30
                );

            b =
                random(
                    1,
                    20
                );

            answer =
                a + b;

            text =
                `${a} + ${b} = ?`;

        }

        else{

            a =
                random(
                    10,
                    40
                );

            b =
                random(
                    1,
                    a
                );

            answer =
                a - b;

            text =
                `${a} − ${b} = ?`;

        }

    }


    /* Tahun 3+ */

    else{

        const type =
            choose([
                "+",
                "-",
                "×",
                "÷"
            ]);

        if(
            type === "+"
        ){

            a =
                random(
                    10,
                    90
                );

            b =
                random(
                    10,
                    90
                );

            answer =
                a + b;

            text =
                `${a} + ${b} = ?`;

        }

        else if(
            type === "-"
        ){

            a =
                random(
                    20,
                    100
                );

            b =
                random(
                    1,
                    a
                );

            answer =
                a - b;

            text =
                `${a} − ${b} = ?`;

        }

        else if(
            type === "×"
        ){

            a =
                random(
                    2,
                    Math.min(
                        12,
                        year + 5
                    )
                );

            b =
                random(
                    2,
                    12
                );

            answer =
                a * b;

            text =
                `${a} × ${b} = ?`;

        }

        else{

            b =
                random(
                    2,
                    10
                );

            answer =
                random(
                    2,
                    10
                );

            a =
                b * answer;

            text =
                `${a} ÷ ${b} = ?`;

        }

    }


    const options =
        new Set([
            answer
        ]);

    while(
        options.size < 4
    ){

        const diff =
            random(
                -8,
                8
            );

        const fake =
            Math.max(
                0,
                answer + diff
            );

        options.add(
            fake
        );

    }


    const shuffled =
        [...options]
        .sort(
            ()=>Math.random() - .5
        );


    return {

        text,

        answer,

        options:
            shuffled

    };

}

/* =========================================================
   29 — SUBMIT ANSWER
========================================================= */

function submitAnswer(
    value
){

    if(
        !state.running ||
        !state.zombie
    ){
        return;
    }


    state.answered++;


    /* CORRECT */

    if(
        Number(value) ===
        state.question.answer
    ){

        state.correct++;

        state.combo++;

        state.bestCombo =
            Math.max(
                state.bestCombo,
                state.combo
            );


        playSfx(
            "correct",
            .5
        );


        const bonus =
            calculateQuickBonus();


        showQuickBonus(
            bonus
        );


        addPower(
            bonus.power
        );


        /* combo sounds */

        if(
            state.combo === 3
        ){

            playSfx(
                "comboUp",
                .65
            );

        }


        if(
            state.combo === 5
        ){

            playSfx(
                "comboBig",
                .75
            );

        }


        /* power full = Math Power */

        const mathPowerReady =
            consumePower();


        let damage =
            bonus.damage;


        if(
            mathPowerReady
        ){

            damage +=
                2;

            playSfx(
                "mathPower",
                .9
            );

            setTimeout(
                ()=>{

                    playSfx(
                        "rapidFire",
                        .7
                    );

                },
                120
            );

            feedback.textContent =
                "⚡ MATH POWER! SERANGAN SUPER!";

        }

        else if(
            bonus.type ===
            "perfect"
        ){

            feedback.textContent =
                "Perfect Quick! 2× damage + banyak Math Power!";

        }

        else if(
            bonus.type ===
            "quick"
        ){

            feedback.textContent =
                "Quick Bonus! Serangan lebih kuat!";

        }

        else{

            feedback.textContent =
                "Betul!";

        }


        shoot(
            damage,
            mathPowerReady
        );


        updateHUD();

    }


    /* WRONG */

    else{

        state.wrong++;

        state.combo =
            0;

        playSfx(
            "wrong",
            .6
        );


        /*
           PENTING:
           soalan TIDAK bertukar.

           Zombie mara satu step.
        */

        wrongZombieStep();


        feedback.textContent =
            "Belum tepat! Cuba lagi — zombi semakin dekat!";


        updateHUD();

    }

}


/* =========================================================
   30 — SHOOT PROJECTILE
========================================================= */

function shoot(
    damage,
    powerShot
){

    const z =
        state.zombie;

    if(
        !z
    ){
        return;
    }


    hero.classList.remove(
        "shoot"
    );

    void hero.offsetWidth;

    hero.classList.add(
        "shoot"
    );


    playSfx(
        "blaster",
        powerShot
            ? .85
            : .62
    );


    const heroRect =
        hero.getBoundingClientRect();

    const arenaRect =
        arena.getBoundingClientRect();

    const zombieRect =
        z.el.getBoundingClientRect();


    const bullet =
        document.createElement(
            "div"
        );

    bullet.className =
        "projectile" +
        (
            powerShot
                ? " power"
                : ""
        );


    arena.appendChild(
        bullet
    );


    const startX =
        heroRect.right -
        arenaRect.left -
        20;

    const startY =
        heroRect.top -
        arenaRect.top +
        heroRect.height *
        .48;


    const endX =
        zombieRect.left -
        arenaRect.left +
        zombieRect.width *
        .45;

    const endY =
        zombieRect.top -
        arenaRect.top +
        zombieRect.height *
        .47;


    bullet.style.left =
        `${startX}px`;

    bullet.style.top =
        `${startY}px`;


    const duration =
        powerShot
            ? 220
            : 320;


    bullet.animate(
        [
            {
                transform:
                    "translate(0,0)"
            },

            {
                transform:
                    `translate(
                        ${endX-startX}px,
                        ${endY-startY}px
                    )`
            }
        ],
        {
            duration,
            easing:"linear"
        }
    );


    setTimeout(
        ()=>{

            bullet.remove();

            projectileImpact(
                z,
                damage,
                powerShot
            );

        },
        duration
    );

}


/* =========================================================
   31 — PROJECTILE IMPACT
========================================================= */

function projectileImpact(
    zombie,
    damage,
    powerShot
){

    if(
        state.zombie !== zombie
    ){
        return;
    }


    const rect =
        zombie.el.getBoundingClientRect();

    const arenaRect =
        arena.getBoundingClientRect();


    const fx =
        document.createElement(
            "div"
        );

    fx.className =
        "impact";


    fx.style.left =
        `${
            rect.left -
            arenaRect.left +
            rect.width/2 -
            30
        }px`;

    fx.style.top =
        `${
            rect.top -
            arenaRect.top +
            rect.height/2 -
            30
        }px`;


    arena.appendChild(
        fx
    );


    setTimeout(
        ()=>fx.remove(),
        380
    );


    playSfx(
        "impact",
        .65
    );


    if(
        zombie.config.boss
    ){

        playSfx(
            "bossHit",
            .72
        );

    }

    else{

        playSfx(
            powerShot
                ? "zombieHitHeavy"
                : "zombieHit",
            .72
        );

    }


    zombie.el.classList.remove(
        "hit"
    );

    void zombie.el.offsetWidth;

    zombie.el.classList.add(
        "hit"
    );


    zombie.hp -=
        damage;


    updateZombieHP();


    if(
        zombie.hp <= 0
    ){

        killZombie();

    }

    else{

        /*
           Betul tapi zombie masih hidup.
           Baru beri soalan baru.
        */

        nextQuestion();

    }

}

        state.zombie;

        !z
    ){

    }

        z.config.boss
    ){

        playSfx(

        );

        );

            nextQuestion();

        600
    );

        "hit"
    );

    void hero.offsetWidth;


    setTimeout(
        ()=>{

            hero.classList.add(
                "hit"
            );

            playSfx(
                "heroHit",
                .72
            );

            state.hp--;

            updateHUD();


            if(
                state.hp <= 0
            ){

                finishGame(
                    false
                );

                return;

            }


            /*
               Zombie ditolak sedikit selepas attack.
               Encounter masih hidup.
            */

            z.x =
                23;

            z.attacking =
                false;

            updateZombiePosition();

        },
        230
    );

}


/* =========================================================
   35 — GAME LOOP
========================================================= */

function gameLoop(
    now
){

    if(
        !state.running
    ){
        return;
    }


    const dt =
        Math.min(
            .04,
            (
                now -
                lastFrame
            ) / 1000 || 0
        );

    lastFrame =
        now;


    const z =
        state.zombie;


    if(
        z &&
        !z.attacking
    ){

        const speed =
            baseZombieSpeed() *
            z.config.speed;


        z.x -=
            speed *
            dt;


        /*
           sampai avatar
        */

        if(
            z.x <= 15
        ){

            z.x =
                15;

            updateZombiePosition();

            zombieAttack();

        }

        else{

            updateZombiePosition();

        }

    }


    rafId =
        requestAnimationFrame(
            gameLoop
        );

}


/* =========================================================
   36 — HUD
========================================================= */

function updateHUD(){

    document.getElementById(
        "hpText"
    ).textContent =
        state.hp;


    document.getElementById(
        "waveText"
    ).textContent =
        state.wave;


    document.getElementById(
        "comboText"
    ).textContent =
        state.combo;


    document.getElementById(
        "powerText"
    ).textContent =
        `${Math.round(state.power)}%`;


    document.getElementById(
        "powerFill"
    ).style.width =
        `${state.power}%`;

}


/* =========================================================
   37 — START GAME
========================================================= */

function startGame(){

    playSfx(
        "click",
        .45
    );


    state = {

        running:true,

        playerName:
            document
            .getElementById(
                "playerName"
            )
            .value.trim()
            || "Hero",

        year:
            Number(
                document
                .getElementById(
                    "yearSelect"
                )
                .value
            ),

        hp:5,

        wave:1,

        combo:0,

        bestCombo:0,

        power:0,

        correct:0,

        wrong:0,

        answered:0,

        zombie:null,

        question:null,

        questionStarted:0,

        spawnCounter:0,

        bossStage:false

    };


    const heroChoice =
        document
        .getElementById(
            "heroSelect"
        )
        .value;


    heroImg.src =
        IMG[
            heroChoice
        ];


    document
    .getElementById(
        "playerLabel"
    )
    .textContent =
        state.playerName;


    showScreen(
        "game"
    );


    /*
       Browser benarkan audio selepas user klik.
    */

    startAudio();


    updateHUD();

    spawnZombie();

    nextQuestion();


    cancelAnimationFrame(
        rafId
    );


    lastFrame =
        performance.now();


    rafId =
        requestAnimationFrame(
            gameLoop
        );


    /*
       Cuba fullscreen automatik,
       jika browser benarkan.
    */

    requestFullscreenSafe();

}


/* =========================================================
   38 — FINISH GAME
========================================================= */

function finishGame(
    victory
){

    state.running =
        false;


    cancelAnimationFrame(
        rafId
    );


    zombieWalkAudio?.pause();


    if(
        victory
    ){

        playSfx(
            "stageClear",
            .8
        );

        setTimeout(
            ()=>{

                playSfx(
                    "victory",
                    .85
                );

                playSfx(
                    "heroVictory",
                    .7
                );

            },
            250
        );

    }

    else{

        playSfx(
            "defeat",
            .8
        );

    }


    document
    .getElementById(
        "resultTitle"
    )
    .textContent =
        victory
            ? "MENANG!"
            : "MISI GAGAL";


    document
    .getElementById(
        "resultText"
    )
    .textContent =
        victory
            ? "Semua gelombang zombi berjaya dikalahkan!"
            : "Zombi berjaya menembusi pertahanan. Cuba lagi!";


    document
    .getElementById(
        "correctStat"
    )
    .textContent =
        state.correct;


    const accuracy =
        state.answered
        ?
        Math.round(
            state.correct /
            state.answered *
            100
        )
        :
        0;


    document
    .getElementById(
        "accuracyStat"
    )
    .textContent =
        `${accuracy}%`;


    document
    .getElementById(
        "comboStat"
    )
    .textContent =
        state.bestCombo;


    showScreen(
        "result"
    );

}


/* =========================================================
   39 — FULLSCREEN
========================================================= */

async function requestFullscreenSafe(){

    try{

        if(
            !document.fullscreenElement &&
            document.documentElement
            .requestFullscreen
        ){

            await document
            .documentElement
            .requestFullscreen();

        }

    }

    catch(err){

        /*
           iPhone Safari lama mungkin tak support.
           Game tetap guna 100dvh.
        */

    }

}


async function toggleFullscreen(){

    playSfx(
        "click",
        .4
    );


    try{

        if(
            document.fullscreenElement
        ){

            await document
            .exitFullscreen();

        }

        else{

            await document
            .documentElement
            .requestFullscreen();

        }

    }

    catch(err){}

}


/* =========================================================
   40 — SOUND TOGGLE
========================================================= */

function toggleSound(){

    soundEnabled =
        !soundEnabled;


    const btn =
        document
        .getElementById(
            "soundBtn"
        );


    btn.textContent =
        soundEnabled
            ? "🔊"
            : "🔇";


    if(
        soundEnabled &&
        state.running
    ){

        startAudio();

        playSfx(
            "click",
            .4
        );

    }

    else{

        stopAudio();

    }

}


/* =========================================================
   41 — UI EVENTS
========================================================= */

document
.getElementById(
    "startBtn"
)
.addEventListener(
    "click",
    startGame
);


document
.getElementById(
    "soundBtn"
)
.addEventListener(
    "click",
    toggleSound
);


document
.getElementById(
    "fullscreenBtn"
)
.addEventListener(
    "click",
    toggleFullscreen
);


document
.getElementById(
    "playAgainBtn"
)
.addEventListener(
    "click",
    ()=>{

        playSfx(
            "click",
            .4
        );

        showScreen(
            "menu"
        );

        stopAudio();

    }
);


document
.getElementById(
    "heroSelect"
)
.addEventListener(
    "change",
    e=>{

        const menuHero =
            document
            .getElementById(
                "menuHero"
            );

        menuHero.src =
            IMG[
                e.target.value
            ];

    }
);


/* =========================================================
   42 — INIT
========================================================= */

initAudio();

</script>
